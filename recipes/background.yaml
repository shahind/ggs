# Recipe: background - a side-view game background: the full scene, plus a far layer (the same scene with the
# foreground and middle ground edited away) to scroll slowly behind the gameplay layer for parallax.
id: background
kind: background
description: Side-view scene plus a far layer for parallax
base_model: flux2-klein-4b
matting: birefnet
size: [1344, 768]
background: "#FFFFFF"
prompt_template: "{style}{description}"   # unused: the layers have their own templates
seamless_x: false
layers:
  - name: far
    opaque: true
    parallax: 0.2
    prompt_template: >-
      {style}wide side-view 2D game background of {description} with layered depth: sky, distant scenery, middle
      distance and a close foreground along the bottom, no characters, no text
post: {alpha_low: 0.04, alpha_high: 0.96, padding: 0, power_of_two: false}
min_profile: lite
