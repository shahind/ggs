[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggs"
version = "0.1.0"
description = "Game Graphic Studio: local AI generation of game-ready 2D assets"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.5",
  "pyyaml>=6",
  "requests>=2.28",  # model downloads
]

[project.optional-dependencies]
image = ["pillow>=10", "scipy>=1.10", "opencv-python-headless>=4.9"]  # opencv: warp animation
# Desktop app (M9): PySide6 is LGPL-3.0, linked dynamically (fine for a closed-source app; ship its licence).
ui = ["PySide6>=6.7", "pillow>=10"]
# Install the CUDA build of torch first (see README); torch>=2.10 is required by the staged pipeline.
gpu = [
  "torch>=2.10",
  "torchvision",
  "diffusers>=0.42",
  "transformers>=5.0",
  "accelerate",
  "peft",
  "bitsandbytes>=0.45; sys_platform != 'darwin'",  # See-through layer model (4-bit weights, CUDA)
  "safetensors",
  "gguf",
  "einops",   # BiRefNet remote code
  "kornia",   # BiRefNet remote code
  "timm",     # BiRefNet remote code
]
# Text to motion (M10): NVIDIA Kimodo's own dependencies; the kimodo package itself is installed by
# tools/install_kimodo.py (its setup.py wants CMake for an optional C++ extension GGS does not use).
motion = ["hydra-core>=1.3", "omegaconf>=2.3", "scipy>=1.10", "einops>=0.7", "bvhio"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ggs = "ggs.cli:main"

[project.gui-scripts]
ggs-studio = "ggs.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ggs.export.engines" = ["*.txt"]
"ggs.ui.icons" = ["*.svg", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU (skipped by default)",
  "mocap_data: needs real clips in data/mocap/ (skipped when missing)",
]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
extend-exclude = ["src/ggs/third_party"]  # vendored code, kept as published
