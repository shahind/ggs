# Model / adapter / motion registry.
# commercial: yes | no | verify
#   yes    = permissive license confirmed from the source listed; may be bundled or default.
#   no     = non-commercial or otherwise unusable for a commercial game; never default.
#   verify = unclear or conflicting sources; license-auditor must resolve it before use.
# Entries reflect research done on 2026-11-04. Re-check the license text itself before shipping anything.
entries:
  - id: flux2-klein-4b
    kind: base
    name: FLUX.2 klein 4B
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 3        # GGUF Q4 inference; bf16 needs more
    source: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B
    notes: Generation + reference-image editing. LoRA training guide lists 12GB for the 4B base.
      Lite profile uses unsloth/FLUX.2-klein-4B-GGUF (Q4_K_M, apache-2.0 per repo); text encoder is Qwen3-4B.

  - id: flux2-klein-9b
    kind: base
    name: FLUX.2 klein 9B
    license: FLUX Non-Commercial
    commercial: "no"
    min_vram_gb: 22
    source: https://docs.us.bfl.ai/flux_2/flux2_klein_training
    notes: Non-commercial. Do not enable by default.

  - id: z-image-turbo
    kind: base
    name: Z-Image Turbo (6B)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 6        # GGUF; fp8 ~8GB; bf16 14-16GB
    source: https://www.thundercompute.com/blog/z-image-turbo-comfyui
    notes: Good text rendering. Turbo is distilled; train LoRAs on Z-Image Base.

  - id: z-image-base
    kind: base
    name: Z-Image Base (6B)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 8
    source: https://www.artifilog.com/posts/best-open-source-image-generation-models
    notes: Undistilled; supports negative prompts and LoRA training. 8GB training only at 512px with offloading.

  - id: qwen-image-2512
    kind: base
    name: Qwen-Image 2512
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 16
    source: https://app.cinevva.com/guides/frontier-gen-ai-models
    notes: Older Apache Qwen checkpoint. Edit variant Qwen-Image-Edit-2511 is used by sprite-sheet LoRAs.

  - id: qwen-image-2.1
    kind: base
    name: Qwen-Image 2.1 (7B, native RGBA)
    license: Qwen Research License
    commercial: "no"
    min_vram_gb: 16
    source: https://www.eesel.ai/blog/qwen-image-2-1-review
    notes: Native transparency, but license is non-commercial only. Do not use for a shipped game without a separate license.

  - id: sdxl-base-1.0
    kind: base
    name: Stable Diffusion XL base 1.0
    license: CreativeML Open RAIL++-M
    commercial: "yes"
    min_vram_gb: 6        # bf16 UNet 5.1 GB for inference; training on 8 GB stores the UNet Linears in fp8
    source: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0
    notes: "Hub card says openrail++ and LICENSE.md is CreativeML Open RAIL++-M (checked 2026-11-03). Commercial
      use is allowed, but the license's use restrictions (Attachment A) must be passed on to users, so the app
      has to show or ship them. Style LoRAs trained here only load on SDXL."

  - id: sdxl-vae-fp16-fix
    kind: component   # part of a pipeline, not a model to pick
    name: SDXL VAE fp16 fix (madebyollin)
    license: MIT
    commercial: "yes"
    min_vram_gb: 1
    source: https://huggingface.co/madebyollin/sdxl-vae-fp16-fix
    notes: "Hub card says mit (checked 2026-11-03). Fine-tuned SDXL VAE that does not overflow in half precision."

  - id: lora-sdxl-lightning-8step
    kind: lora
    name: SDXL-Lightning 8-step LoRA (ByteDance)
    base: sdxl-base-1.0
    license: CreativeML Open RAIL++-M
    commercial: "yes"
    source: https://huggingface.co/ByteDance/SDXL-Lightning
    notes: "Hub card says openrail++ (checked 2026-11-03). Distillation LoRA: 8 steps, CFG off, trailing Euler
      schedule. Loaded under the user's style LoRA for every SDXL generation when present."

  - id: t2i-adapter-openpose-sdxl
    kind: component
    name: T2I-Adapter OpenPose SDXL 1.0 (TencentARC)
    base: sdxl-base-1.0
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 0.2
    source: https://huggingface.co/TencentARC/t2i-adapter-openpose-sdxl-1.0
    notes: "Hub card says apache-2.0 (checked 2026-11-05). 79M-parameter adapter (316 MB fp32): SDXL draws a
      character in the pose of an OpenPose skeleton rendered from the rig (klein follows a stick figure instead)."

  - id: lora-pixel-art-klein4b
    kind: lora
    name: Limbicnation pixel-art sprite LoRA
    base: flux2-klein-4b
    license: Apache-2.0
    commercial: "yes"
    source: https://huggingface.co/Limbicnation/pixel-art-lora
    notes: Trained on CC0 data per model card. Pixel-art character sprites.

  - id: lora-spritesheet-klein4b
    kind: lora
    name: fal klein 4B 2x2 multi-angle sprite sheet LoRA
    base: flux2-klein-4b
    license: unknown
    commercial: verify
    source: https://huggingface.co/fal/flux-2-klein-4b-spritesheet-lora
    notes: Edit LoRA (single object -> 4 angles). Check license on the original repo, not the mirror.

  - id: lora-pixel-4walk-klein4b
    kind: lora
    name: svntax pixel 4-direction walk sheet LoRA
    base: flux2-klein-4b
    license: unknown
    commercial: verify
    source: https://hf-cn0.pages.dev/svntax-dev/pixel_spritesheet_4walk_small_lora_v1
    notes: 32x32 pixel characters; works via text-to-image or edit with a reference.

  - id: birefnet
    kind: matting
    name: BiRefNet (ZhengPeng7) dichotomous segmentation / background removal
    license: MIT
    commercial: "yes"
    min_vram_gb: 2
    source: https://huggingface.co/ZhengPeng7/BiRefNet
    notes: "Model card header says MIT (checked 2026-11-03). Runs at 1024x1024, ~1.6 GB peak in fp16.
      Its remote code needs einops, kornia, timm. RMBG-2.0 (built on it) is CC BY-NC, do not use."

  - id: dreamshaper-8
    kind: base
    name: DreamShaper 8 (Stable Diffusion 1.5 fine-tune)
    license: CreativeML OpenRAIL-M
    commercial: verify
    min_vram_gb: 6
    source: https://huggingface.co/Lykon/dreamshaper-8
    notes: "OpenRAIL-M (use restrictions, commercial use of outputs allowed). Base for AnimateDiff frames."

  - id: one-to-all-1.3b
    kind: component
    name: One-to-All Animation 1.3B (v2 checkpoint, Wan2.1-T2V-1.3B based)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 6
    source: https://huggingface.co/MochunniaN1/One-to-All-1.3b_2
    notes: "Apache-2.0 (code github.com/ssj9596/One-to-All-Animation and weights, per the repo and model card,
      2026-11-05). Pose-driven character animation, alignment-free, trained with cartoon data. Inference code
      vendored in src/ggs/third_party/one_to_all. Needs wan2.1-t2v-1.3b (VAE, tokenizer, configs) and umt5-xxl."

  - id: wan2.1-t2v-1.3b
    kind: component
    name: Wan2.1 T2V 1.3B (diffusers; VAE, tokenizer and configs only)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 1
    source: https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers

  - id: umt5-xxl
    kind: component
    name: umT5-xxl text encoder (fp16, Comfy-Org repack of the Wan2.1 text encoder)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 1
    source: https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged
    notes: "Wan's umT5-xxl (Apache-2.0) in fp16 (11.4 GB instead of the 21 GB fp32 copy). Streamed onto the GPU
      layer by layer; prompt embeddings are cached in ~/.ggs/cache/one_to_all."

  - id: animatediff-motion-adapter-v1-5-3
    kind: component
    name: AnimateDiff motion adapter v1-5-3 (SD 1.5)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 6
    source: https://huggingface.co/guoyww/animatediff-motion-adapter-v1-5-3
    notes: "Apache-2.0 per the AnimateDiff repo (check the model card before release). Spike 2026-11-05: 16 frames
      at 384x512 with ControlNet OpenPose + IP-Adapter Plus, 75 s, 6.4 GB peak with model CPU offload."

  - id: control-v11p-sd15-openpose
    kind: component
    name: ControlNet 1.1 OpenPose (SD 1.5)
    license: CreativeML OpenRAIL-M
    commercial: verify
    min_vram_gb: 2
    source: https://huggingface.co/lllyasviel/control_v11p_sd15_openpose

  - id: ip-adapter-plus-sd15
    kind: component
    name: IP-Adapter Plus SD 1.5 + OpenCLIP ViT-H image encoder
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 2
    source: https://huggingface.co/h94/IP-Adapter
    notes: "Adapter Apache-2.0; the image encoder is LAION's OpenCLIP ViT-H-14 (MIT)."

  - id: segformer-b2-clothes
    kind: segmentation
    name: SegFormer-B2 fine-tuned on ATR clothes/body-part labels (mattmdjaga)
    license: MIT
    commercial: "yes"
    min_vram_gb: 1
    source: https://huggingface.co/mattmdjaga/segformer_b2_clothes
    notes: "MIT per the model card (check before release; trained on ATR, a research dataset). 18 classes: hat,
      hair, face, upper clothes, skirt, pants, dress, belt, shoes, arm/leg skin, bag, scarf. Reads 3D-rendered and
      flat cartoon characters well, costumes less so (a clown suit read as pants)."

  - id: vitpose-base-simple
    kind: segmentation
    name: ViTPose base (simple decoder), COCO 17 body keypoints
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 1
    source: https://huggingface.co/usyd-community/vitpose-base-simple
    notes: "Apache-2.0 per the model card (checked 2026-11-05); runs in transformers (VitPoseForPoseEstimation).
      ~0.2 GB of VRAM in fp16, about a second per drawing. Finds the joints of drawn side-view characters
      reliably when the limbs are apart (the slicing template poses); weaker with arms down over the body."

  - id: qwen3-vl-2b
    kind: captioning
    name: Qwen3-VL-2B-Instruct (vision-language captioner)
    license: Apache-2.0
    commercial: "yes"
    min_vram_gb: 6
    source: https://huggingface.co/Qwen/Qwen3-VL-2B-Instruct
    notes: "Model card says apache-2.0 (checked 2026-11-03). Used only at style-training time to caption the
      user's images, never shipped in a game."

  - id: kimodo-soma
    kind: motion
    name: NVIDIA Kimodo SOMA-RP v1.2 (text to motion)
    license: NVIDIA Open Model License
    commercial: "yes"
    min_vram_gb: 2        # measured 1.1 GB peak on the RTX 4060 Laptop (3 s take, 100 steps, ~6 s)
    source: https://huggingface.co/nvidia/Kimodo-SOMA-RP-v1.2
    notes: "The LICENSE file in the repo (read 2026-11-04) says 'Models are commercially usable' and NVIDIA
      does not claim ownership of outputs; the card says 'ready for commercial use'. Code (kimodo package) is
      Apache-2.0. Its foot-contact post-process needs a compiled C++ extension and is not used."

  - id: llm2vec-llama3-8b
    kind: component
    name: LLM2Vec Llama-3-8B-Instruct (MNTP + supervised adapters), Kimodo's text encoder
    license: Meta Llama 3 Community License (base weights) + MIT (McGill-NLP adapters)
    commercial: verify
    min_vram_gb: 1        # streamed block by block from RAM (needs ~16 GB system RAM)
    source: https://huggingface.co/NousResearch/Meta-Llama-3-8B-Instruct
    notes: "Base weights are Meta's (the NousResearch copy is ungated; same files as meta-llama/...). Llama 3
      licence: commercial use allowed under 700M monthly users, attribution 'Built with Meta Llama 3' when
      distributing; GGS does not distribute the weights (the user downloads them). Adapters:
      McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp(-supervised), MIT. Only text embeddings are used."

  - id: hy-motion-1.0
    kind: motion
    name: Tencent HY-Motion 1.0
    license: Tencent HY-Motion Community License
    commercial: verify
    min_vram_gb: 24
    source: https://github.com/Tencent-Hunyuan/HY-Motion-1.0
    notes: Sources conflict (MIT / Apache / custom). One source says the custom license excludes EU, UK, South Korea. Read the repo LICENSE.

  - id: momask-mdm-family
    kind: motion
    name: MoMask / MDM / T2M-GPT (HumanML3D-trained)
    license: depends on AMASS-derived training data
    commercial: "no"
    source: https://amass.is.tue.mpg.de/license.html
    notes: AMASS license is non-commercial and prohibits training models for commercial use. Avoid.

  - id: cmu-mocap
    kind: dataset
    name: CMU Graphics Lab Motion Capture Database (BVH, Bruce Hahne conversion)
    license: CMU terms ("free for use in research and commercial projects")
    commercial: "yes"
    source: http://mocap.cs.cmu.edu
    notes: "Terms quoted in READMEFIRST.txt of the cgspeed release (mirror github.com/meshula/cmu-mocap); the
      converter adds no restrictions. Credit: 'The data used in this project was obtained from mocap.cs.cmu.edu.'
      Bundled as converted 2D clips in motions/catalogs/cmu.zip."

  - id: 100style
    kind: dataset
    name: The 100STYLE Dataset (Ian Mason)
    license: CC BY 4.0
    commercial: "yes"
    source: https://zenodo.org/record/8127870
    notes: "Attribution required: 'The 100STYLE Dataset - Ian Mason'. Bundled as converted 2D loops in
      motions/catalogs/100style.zip."
