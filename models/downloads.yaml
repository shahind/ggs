# Model packs the app can download on first run (into ~/.ggs/models). Nothing here is bundled in the installer.
# A pack is ready when every pipeline / matting / captioning entry it names resolves (`ggs models status`).
# Sizes are from the Hugging Face hub (2026-11-04). Licences: docs/LICENSE_REVIEW.md.

# Small model files the installer DOES include (owner, 2026-11-04: bundle the LoRAs). tools/build_app.py copies
# each from the first model folder that has it into <app>/models/, which is searched last.
bundled:
  - SDXL-Lightning/sdxl_lightning_8step_lora.safetensors   # 394 MB, openrail++

packs:
  drawing:
    label: Drawing model (FLUX.2 klein 4B)
    why: Draws every asset and character.
    required: true
    size_gb: 10.1
    ready_when: {pipelines: [flux2-klein-4b]}
    parts:
      - repo: black-forest-labs/FLUX.2-klein-4B
        dir: FLUX.2-klein-4B
        include: [model_index.json, "scheduler/*", "tokenizer/*", "text_encoder/*", transformer/config.json, "vae/*"]
      - repo: unsloth/FLUX.2-klein-4B-GGUF
        dir: FLUX.2-klein-4B-GGUF
        include: [flux-2-klein-4b-Q4_K_M.gguf]
  cutout:
    label: Cut-out model (BiRefNet), joint finder (ViTPose) and body parser (SegFormer)
    why: Gives every asset a clean transparent background, and finds a character's joints and body parts.
    required: true
    size_gb: 0.85
    ready_when: {matting: [birefnet], pose: [vitpose-base-simple, segformer-b2-clothes]}
    parts:
      - repo: ZhengPeng7/BiRefNet
        dir: BiRefNet
        include: ["*"]
      - repo: usyd-community/vitpose-base-simple
        dir: vitpose-base-simple
        include: ["*.json", "*.safetensors"]
      - repo: mattmdjaga/segformer_b2_clothes
        dir: segformer-b2-clothes
        include: ["*.json", "model.safetensors"]
  frames:
    label: Frame animator (AnimateDiff + OpenPose, optional)
    why: Draws a character's animation frame by frame, following the skeleton and keeping the design.
    required: false
    size_gb: 6.2
    ready_when: {frames: [animatediff-sd15]}
    parts:
      - repo: Lykon/dreamshaper-8
        dir: dreamshaper-8
        include: ["model_index.json", "scheduler/*", "tokenizer/*", "feature_extractor/*", "text_encoder/config.json",
                  "text_encoder/model.fp16.safetensors", "unet/config.json",
                  "unet/diffusion_pytorch_model.fp16.safetensors", "vae/config.json",
                  "vae/diffusion_pytorch_model.fp16.safetensors"]
      - repo: guoyww/animatediff-motion-adapter-v1-5-3
        dir: animatediff-motion-adapter-v1-5-3
        include: ["config.json", "diffusion_pytorch_model.fp16.safetensors"]
      - repo: lllyasviel/control_v11p_sd15_openpose
        dir: control_v11p_sd15_openpose
        include: ["config.json", "diffusion_pytorch_model.fp16.safetensors"]
      - repo: h94/IP-Adapter
        dir: IP-Adapter
        include: ["models/ip-adapter-plus_sd15.safetensors", "models/image_encoder/config.json",
                  "models/image_encoder/model.safetensors"]
  sdxl:
    label: SDXL (optional second drawing model)
    why: Faster style training; a different look. (Its 8-step Lightning LoRA comes with the installer.)
    required: false
    size_gb: 7.0
    ready_when: {pipelines: [sdxl]}
    parts:
      - repo: stabilityai/stable-diffusion-xl-base-1.0
        dir: stable-diffusion-xl-base-1.0
        include: [model_index.json, "scheduler/*", "tokenizer/*", "tokenizer_2/*", text_encoder/config.json,
                  text_encoder/model.fp16.safetensors, text_encoder_2/config.json,
                  text_encoder_2/model.fp16.safetensors, unet/config.json,
                  unet/diffusion_pytorch_model.fp16.safetensors, vae/config.json]
      - repo: madebyollin/sdxl-vae-fp16-fix
        dir: sdxl-vae-fp16-fix
        include: [config.json, diffusion_pytorch_model.safetensors]
      - repo: TencentARC/t2i-adapter-openpose-sdxl-1.0   # 316 MB: draws characters in the chosen pose
        dir: t2i-adapter-openpose-sdxl-1.0
        include: [config.json, diffusion_pytorch_model.safetensors]
  captioner:
    label: Image describer (Qwen3-VL 2B)
    why: Only needed to train your own styles.
    required: false
    size_gb: 4.0
    ready_when: {captioning: [qwen3-vl-2b]}
    parts:
      - repo: Qwen/Qwen3-VL-2B-Instruct
        dir: Qwen3-VL-2B-Instruct
        include: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
  motion:
    label: Motion model (NVIDIA Kimodo)
    why: Makes new animations; on its own it varies the library's motions (new takes, other lengths).
    required: false
    size_gb: 1.06
    ready_when: {motion: [kimodo-soma]}
    parts:
      - repo: nvidia/Kimodo-SOMA-RP-v1.2
        dir: Kimodo-SOMA-RP-v1.2
        include: ["*"]
  motion_text:
    label: Motion text reader (Llama 3 8B + LLM2Vec)
    why: Lets you describe any new animation in words. Needs 16 GB of system memory.
    required: false
    size_gb: 15.3
    ready_when: {motion_text: [kimodo-soma]}
    parts:
      - repo: NousResearch/Meta-Llama-3-8B-Instruct
        dir: Meta-Llama-3-8B-Instruct
        include: ["*.json", "*.safetensors"]
      - repo: McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp
        dir: LLM2Vec-Meta-Llama-3-8B-Instruct-mntp
        include: ["*.json", "*.safetensors"]
      - repo: McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp-supervised
        dir: LLM2Vec-Meta-Llama-3-8B-Instruct-mntp-supervised
        include: ["*.json", "*.safetensors"]
